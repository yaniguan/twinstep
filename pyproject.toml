[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twinstep"
version = "0.1.0"
description = "Seeded-error twin generator for generic liquid-handling protocol steps"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yani Guan" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
twinstep = "twinstep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
